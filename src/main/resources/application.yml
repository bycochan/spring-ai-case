spring:
  application:
    name: spring-ai-agent
  mvc:
    async:
      # 流式回复耗时较长：显式放宽 MVC 异步请求超时（毫秒），避免长回复撞容器默认异步超时中断流
      request-timeout: 300000
  servlet:
    multipart:
      # 附件上传限制：单张图片 10MB（不设置时 Spring Boot 默认单文件仅 1MB）
      max-file-size: 10MB
      max-request-size: 15MB
  ai:
    zhipuai:
      # API Key 从项目根目录 .env 读取（DotenvEnvironmentPostProcessor 加载，优先级高于系统环境变量）；
      # 兼容旧启动参数 -Dzhipuai-api-key=xxx；均未配置时为空，调用时返回明确的鉴权错误
      api-key: ${ZHIPUAI_API_KEY:${zhipuai-api-key:}}
      chat:
        options:
          model: glm-5.3-flash

server:
  port: 8089

# Milvus 向量数据库配置
milvus:
  enabled: false  # 默认关闭，需要使用 RAG 功能时设置为 true 并启动 Milvus
  host: localhost
  port: 19530

logging:
  level:
    com.tes.springai: INFO
    org.springframework.ai: DEBUG
