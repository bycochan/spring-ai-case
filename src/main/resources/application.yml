spring:
  application:
    name: spring-ai-agent
  servlet:
    multipart:
      # 附件上传限制：单张图片 10MB（不设置时 Spring Boot 默认单文件仅 1MB）
      max-file-size: 10MB
      max-request-size: 15MB
  ai:
    zhipuai:
      # api-key 使用你自己申请的进行替换；如果为了安全考虑，可以通过启动参数进行设置
      api-key: ${zhipuai-api-key}
      chat:
        options:
          model: glm-5.3-flash

server:
  port: 8089

# Milvus 向量数据库配置
milvus:
  enabled: false  # 默认关闭，需要使用 RAG 功能时设置为 true 并启动 Milvus
  host: localhost
  port: 19530

logging:
  level:
    com.tes.springai: INFO
    org.springframework.ai: DEBUG
